name: Create FantaPilot general competition manually

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nome competizione (3-100 caratteri)"
        required: true
        type: string
      catalog_id:
        description: "ID del catalogo ufficiale pubblicato"
        required: true
        type: string
      expected_hash:
        description: "Content hash del catalogo (non checksum Excel)"
        required: true
        type: string
      opens_at:
        description: "Apertura futura ISO con fuso: AAAA-MM-GGTHH:MM:SS+01:00"
        required: true
        type: string
      deadline_at:
        description: "Scadenza consegna ISO con fuso"
        required: true
        type: string
      ends_at:
        description: "Fine competizione ISO con fuso"
        required: true
        type: string
      confirmation:
        description: "Scrivere CREA: creazione reale con regolamento generale fisso"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fantapilot-general-competition-creation
  cancel-in-progress: false

jobs:
  create:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPETITION_NAME: ${{ inputs.name }}
      CATALOG_ID: ${{ inputs.catalog_id }}
      EXPECTED_HASH: ${{ inputs.expected_hash }}
      OPENS_AT: ${{ inputs.opens_at }}
      DEADLINE_AT: ${{ inputs.deadline_at }}
      ENDS_AT: ${{ inputs.ends_at }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate inputs without credentials or network
        run: |
          python3 create-general-competition.py --dry-run \
            --name "$COMPETITION_NAME" --catalog-id "$CATALOG_ID" \
            --expected-hash "$EXPECTED_HASH" --opens-at "$OPENS_AT" \
            --deadline-at "$DEADLINE_AT" --ends-at "$ENDS_AT" \
            --confirmation "$CONFIRMATION"
      - name: Create one general competition without automatic retry
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: |
          python3 create-general-competition.py \
            --name "$COMPETITION_NAME" --catalog-id "$CATALOG_ID" \
            --expected-hash "$EXPECTED_HASH" --opens-at "$OPENS_AT" \
            --deadline-at "$DEADLINE_AT" --ends-at "$ENDS_AT" \
            --confirmation "$CONFIRMATION"
