name: Genera lista giocatori

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install pandas openpyxl xlsxwriter

      - name: Genera lista giocatori
        run: |
          python genera_lista_giocatori.py \
            "Statistiche_Fantacalcio_Stagione_2026_27 (5).xlsx" \
            "Quotazioni_Fantacalcio_Stagione_2026_27 (5).xlsx" \
            --output ListaGiocatori.xlsx

      - name: Rendi scaricabile il risultato
        uses: actions/upload-artifact@v4
        with:
          name: ListaGiocatori
          path: ListaGiocatori.xlsx
          if-no-files-found: error
          retention-days: 30
